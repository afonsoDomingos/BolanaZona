<html lang="pt">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bola na Zona - Plataforma de gestão de torneios de futebol de bairro. Cria torneios, gere equipas e acompanha classificações em tempo real." />
    <link rel="manifest" href="/manifest.json" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ Service Worker registado'))
            .catch(err => console.log('❌ Erro no Service Worker', err));
        });
      }
    </script>
  </body>
